
<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        body {
            font-family: ;
            background-color: aquamarine;
        }

        form {
            background-color: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border: 2px solid navy;
            float: left;
        }

        h2 {
            text-align: center;
            color: navy;
        }

        input, textarea {
            width: 95%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }
    </style>
</head>

<body>

    <form>
        <h2>Contact Us</h2>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Phone Number:</label>
        <input type="tel" placeholder="Enter your phone number">
        <label>Location:</label><input type="text" placeholder="Enter your location">

        <label>Message:</label>
        <textarea placeholder="Enter your message"></textarea>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
