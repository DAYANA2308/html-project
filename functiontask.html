//4.Write a function factorial(num) that calculates the factorial of a given number.

        function factorial(num){
            let fact=1;
            for(let i=1; i<=num;i++){
                fact =fact*i;
            }
            return fact;}
        
        let a=5;
        let result3=factorial(a);

//6.Write a function countVowels(str) that counts the number of vowels in a given string.

function countvowels(str){
    let count=0;
    for (let i=0; i<str.length; i++){
            if("aeiou".includes(str[i].toLowerCase())){
            count++;
        }
    }
    return count;
}
